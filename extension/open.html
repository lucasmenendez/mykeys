<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MyKeys</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: Canvas;
      color: CanvasText;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
    }
    .card {
      width: min(100%, 26rem);
      padding: 1.5rem;
      border: 1px solid color-mix(in srgb, CanvasText 15%, transparent);
      text-align: center;
    }
    h1 { margin: 0 0 0.5rem; font-size: 1.25rem; }
    p { margin: 0 0 1rem; line-height: 1.5; }
    .status { color: color-mix(in srgb, CanvasText 65%, transparent); }
    button {
      width: 100%;
      padding: 0.6rem 0.9rem;
      border: 0;
      border-radius: 0;
      background: CanvasText;
      color: Canvas;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: default; }
    .hint { margin: 1rem 0 0; font-size: 0.8125rem; }
    .hint a { color: inherit; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="card">
    <h1>🔐 MyKeys</h1>
    <p class="status" id="status">Opening your vault in the side panel…</p>
    <button type="button" id="open-panel" hidden>Open side panel</button>
    <p class="hint"><a id="open-tab" href="index.html">Open in this tab instead</a></p>
  </main>
  <script src="open.js"></script>
</body>
</html>
